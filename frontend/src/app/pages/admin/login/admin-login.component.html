<div class="login-page">
  <div class="login-card">
    <h1>Admin Panel</h1>
    <p class="subtitle">Luciana Mayre Imóveis</p>

    @if (error()) {
      <p class="error-msg">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="your@email.com" />
      </div>
      <div class="field">
        <label for="senha">Password</label>
        <input id="senha" type="password" formControlName="senha" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn-primary btn-login" [disabled]="form.invalid || loading()">
        {{ loading() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>
