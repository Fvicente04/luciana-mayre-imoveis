<article class="property-card">
  <a [routerLink]="['/imoveis', imovel.id, imovel.slug]" class="card-link">
    <div class="card-image">
      @if (imovel.fotoPrincipal) {
        <img [src]="imovel.fotoPrincipal" [alt]="imovel.titulo" loading="lazy" />
      } @else {
        <div class="image-placeholder">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
      }

      <div class="card-overlay">
        <span class="badge" [class.badge-aluguel]="imovel.finalidade === 'aluguel'">
          {{ imovel.finalidade === 'venda' ? 'Venda' : 'Aluguel' }}
        </span>

        <div class="card-info">
          <p class="price">{{ imovel.preco | currency:'BRL':'symbol':'1.0-0' }}</p>
          <p class="title">{{ imovel.bairro }} · {{ imovel.cidade }}</p>
          <div class="meta">
            <span>{{ imovel.quartos }} quartos</span>
            <span>{{ imovel.area }} m²</span>
            @if (imovel.vagas > 0) { <span>{{ imovel.vagas }} vagas</span> }
          </div>
        </div>
      </div>
    </div>
  </a>

  <button
    class="favorite-btn"
    (click)="toggleFavorite($event)"
    [attr.aria-label]="isFavorited() ? 'Remover dos favoritos' : 'Adicionar aos favoritos'"
    [class.favorited]="isFavorited()"
  >
    {{ isFavorited() ? '♥' : '♡' }}
  </button>
</article>
