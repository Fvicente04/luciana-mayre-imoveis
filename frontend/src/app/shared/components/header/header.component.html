<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="logo">
      <img src="/logo.png" alt="Luciana Mayre Imóveis" class="logo-img" />
    </a>

    <nav class="nav-desktop">
      <a routerLink="/imoveis" [queryParams]="{finalidade: 'venda'}" routerLinkActive="active">Comprar</a>
      <a routerLink="/imoveis" [queryParams]="{finalidade: 'aluguel'}" routerLinkActive="active">Alugar</a>
      <a routerLink="/sobre" routerLinkActive="active">Sobre mim</a>
      <a routerLink="/contato" routerLinkActive="active">Contato</a>
    </nav>

    <button class="hamburger" (click)="toggleMenu()" [attr.aria-expanded]="mobileMenuOpen()" aria-label="Menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

@if (mobileMenuOpen()) {
  <div class="mobile-drawer" (click)="closeMenu()">
    <nav class="mobile-nav" (click)="$event.stopPropagation()">
      <a routerLink="/imoveis" [queryParams]="{finalidade: 'venda'}" (click)="closeMenu()">Comprar</a>
      <a routerLink="/imoveis" [queryParams]="{finalidade: 'aluguel'}" (click)="closeMenu()">Alugar</a>
      <a routerLink="/sobre" (click)="closeMenu()">Sobre mim</a>
      <a routerLink="/contato" (click)="closeMenu()">Contato</a>
    </nav>
  </div>
}
