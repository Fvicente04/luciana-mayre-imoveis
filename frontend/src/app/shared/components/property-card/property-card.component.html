<article class="property-card">
  <a [routerLink]="['/imoveis', imovel.id, imovel.slug]" class="card-link">
    <div class="card-image">
      @if (imovel.fotoPrincipal) {
        <img [src]="imovel.fotoPrincipal" [alt]="imovel.titulo" loading="lazy" />
      } @else {
        <div class="image-placeholder">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        </div>
      }
      <span class="badge" [class.badge-aluguel]="imovel.finalidade === 'aluguel'">
        {{ imovel.finalidade === 'venda' ? 'For sale' : 'For rent' }}
      </span>
    </div>

    <div class="card-body">
      <p class="price">{{ imovel.preco | currency:'BRL':'symbol':'1.0-0' }}</p>
      <p class="title">{{ imovel.tipo | titlecase }} — {{ imovel.bairro }}</p>
      <div class="meta">
        <span title="Bedrooms">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 22v-7m0-4V2m18 20v-7m0-4V2M3 11h18M3 15h18"/></svg>
          {{ imovel.quartos }}
        </span>
        <span title="Area">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          {{ imovel.area }} m²
        </span>
        @if (imovel.vagas > 0) {
          <span title="Parking spots">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 3v5h-7V8z"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            {{ imovel.vagas }}
          </span>
        }
      </div>
    </div>
  </a>

  <button
    class="favorite-btn"
    (click)="toggleFavorite($event)"
    [attr.aria-label]="isFavorited() ? 'Remove from favorites' : 'Add to favorites'"
    [class.favorited]="isFavorited()"
  >
    {{ isFavorited() ? '♥' : '♡' }}
  </button>
</article>
